[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xeneon-touch"
version = "0.1.2"
description = "Open-source macOS touch driver for the Corsair Xeneon Edge monitor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    # cython 'hidapi' (provides hid.device()/.open()) — NOT the 'hid'/pyhidapi
    # package, which shares the import name but has an incompatible API.
    "hidapi>=0.14.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

[tool.setuptools]
packages = ["xeneon_touch"]

[project.scripts]
xeneon-touch = "xeneon_touch.__main__:main"

[project.urls]
Homepage = "https://github.com/Myseri/xeneon-edge-multitouch-macos"
Issues   = "https://github.com/Myseri/xeneon-edge-multitouch-macos/issues"
