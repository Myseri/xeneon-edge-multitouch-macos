[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "xeneon-touch"
version = "0.1.0"
description = "Open-source macOS touch driver for the Corsair Xeneon Edge monitor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "hid>=1.0.5",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

[project.scripts]
xeneon-touch = "xeneon_touch.__main__:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/xeneon-touch"
Issues   = "https://github.com/YOUR_USERNAME/xeneon-touch/issues"
